@()(implicit request: JRequestHeader)

@main {
    <h1>Server Sent Event clock</h1>
    
    <h1 id="clock"></h1>
    
    <p>
        Clock events are pushed from the Server using a Server Sent Event connection.
    </p>

    <button id="startButton">Start Streaming</button>
    <button id="stopButton">Stop Streaming</button>

    <div id="response-container"></div>

    <script @{CSPNonce.attr} src="@routes.Assets.at("javascripts/chatSession.js")"></script>
}
